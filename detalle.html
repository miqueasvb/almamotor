            { id: "volkswagen-gol-2007", marca: "Volkswagen", modelo: "Gol 1.6", anio: 2007, km: 95000, estado: "usado", foto: "img/vehiculos/vacio.avif", descripcion: "Noble, fiel y económico." }
        ];

        // Leer parámetro de la URL
        const params = new URLSearchParams(window.location.search);
        const idVehiculo = params.get("vehiculo");

        // Buscar el vehículo correspondiente
        const vehiculoEncontrado = vehiculos.find(v => v.id === idVehiculo);
        const contenedor = document.getElementById("detalle-container");

        if (vehiculoEncontrado) {
            const mensajeWa = encodeURIComponent(`Hola, me interesa el ${vehiculoEncontrado.marca} ${vehiculoEncontrado.modelo} que vi en la web.`);
            
            contenedor.innerHTML = `
                <div class="col-lg-7">
                    <img src="${vehiculoEncontrado.foto}" alt="${vehiculoEncontrado.modelo}" style="width: 100%; border-radius: 8px; object-fit: cover;">
                </div>
                <div class="col-lg-5">
                    <span style="color: #e31b23; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">${vehiculoEncontrado.marca}</span>
                    <h1 style="font-size: 32px; font-weight: 700; margin-top: 5px;">${vehiculoEncontrado.modelo}</h1>
                    <hr style="border-color: rgba(255,255,255,0.2);">
                    <p><strong>Año:</strong> ${vehiculoEncontrado.anio || 'A confirmar'}</p>
                    <p><strong>Kilometraje:</strong> ${vehiculoEncontrado.km != null ? vehiculoEncontrado.km.toLocaleString() + ' km' : 'A confirmar'}</p>
                    <p><strong>Estado:</strong> <span style="text-transform: uppercase;">${vehiculoEncontrado.estado}</span></p>
                    <p style="margin-top: 20px; color: #ccc;">${vehiculoEncontrado.descripcion}</p>
                    
                    <a href="https://wa.me/5493735610059?text=${mensajeWa}" target="_blank" class="btn btn-danger btn-lg mt-3" style="background-color: #e31b23; border: none; width: 100%;">
                        Consultar por WhatsApp
                    </a>
                </div>
            `;
        } else {
            contenedor.innerHTML = `
                <div class="col-12 text-center">
                    <h2>Vehículo no encontrado</h2>
                    <p>El vehículo que buscás no existe o el enlace es incorrecto.</p>
                    <a href="catalogo.html" class="btn btn-primary mt-3">Volver al catálogo</a>
                </div>
            `;
        }
    </script>

</html>
